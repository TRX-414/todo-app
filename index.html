<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待办清单</title>
  <style>
    /* ===== 全局样式 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }

    /* ===== 卡片容器 ===== */
    .container {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      padding: 32px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* ===== 输入区 ===== */
    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus {
      border-color: #667eea;
    }

    #add-btn {
      padding: 12px 24px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #add-btn:hover {
      background: #556cd6;
    }

    /* ===== 待办列表 ===== */
    #todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: #f7f8fa;
      border-radius: 8px;
      margin-bottom: 10px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-text {
      color: #333;
      font-size: 15px;
      word-break: break-all;
      margin-right: 12px;
    }

    .delete-btn {
      background: #ff6b6b;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .delete-btn:hover {
      background: #ee5a5a;
    }

    /* ===== 空状态提示 ===== */
    .empty-tip {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 20px 0;
    }

    /* ===== 版本号角标 ===== */
    .version {
      text-align: center;
      color: #ccc;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 我的待办清单</h1>
    <p class="subtitle">今天要做点什么呢？</p>

    <!-- 输入区：输入框 + 添加按钮 -->
    <div class="input-area">
      <input type="text" id="todo-input" placeholder="输入一件待办事项...">
      <button id="add-btn">添加</button>
    </div>

    <!-- 待办列表：由 JS 动态生成 -->
    <ul id="todo-list"></ul>

    <p class="version">v1.0.0</p>
  </div>

  <script>
    // ===== 获取页面元素 =====
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');

    // ===== 用一个数组保存所有待办 =====
    let todos = [];

    // ===== 添加一条待办 =====
    function addTodo() {
      const text = input.value.trim();  // 去掉首尾空格
      if (text === '') {
        return;  // 空的就不添加（v1.1.1 会给出更友好的提示）
      }
      todos.push(text);   // 存进数组
      input.value = '';   // 清空输入框
      render();           // 重新渲染列表
    }

    // ===== 删除一条待办 =====
    function deleteTodo(index) {
      todos.splice(index, 1);  // 从数组里移除第 index 条
      render();
    }

    // ===== 把 todos 数组渲染成页面上的列表 =====
    function render() {
      list.innerHTML = '';  // 先清空

      if (todos.length === 0) {
        list.innerHTML = '<p class="empty-tip">暂无待办，添加一条吧 👆</p>';
        return;
      }

      todos.forEach((text, index) => {
        const li = document.createElement('li');
        li.className = 'todo-item';

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = text;  // 用 textContent 避免 XSS

        const btn = document.createElement('button');
        btn.className = 'delete-btn';
        btn.textContent = '删除';
        btn.onclick = () => deleteTodo(index);

        li.appendChild(span);
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    // ===== 绑定事件 =====
    addBtn.onclick = addTodo;               // 点按钮添加
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();     // 回车也能添加
    });

    // ===== 首次渲染（显示空状态） =====
    render();
  </script>
</body>
</html>
